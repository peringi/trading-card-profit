<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トレカ利益計算機</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    .container { max-width: 520px; margin: 40px auto; padding: 20px; }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { text-align: center; margin: 0 0 8px; font-size: 26px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 7px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6d9dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #666; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
    .result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      border-radius: 14px;
      background: #f7f7f7;
    }
    .result.show { display: block; }
    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
    .result-row:last-child { border-bottom: 0; }
    .profit {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }
    .rate { text-align: center; font-size: 20px; font-weight: bold; }
    .judgment {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .buy { background: #e7f7ed; color: #147a3c; }
    .skip { background: #fdeaea; color: #c62828; }
    .warning {
      color: #c62828;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🃏 トレカ利益計算機</h1>
      <div class="subtitle">仕入れる価値があるか一瞬で判定</div>

      <div class="form-group">
        <label for="productName">商品名</label>
        <input type="text" id="productName" placeholder="例：○○カード SAR">
      </div>

      <div class="form-group">
        <label for="purchasePrice">仕入れ価格（円）</label>
        <input type="number" id="purchasePrice" placeholder="5000" min="0">
      </div>

      <div class="form-group">
        <label for="sellingPrice">販売価格（円）</label>
        <input type="number" id="sellingPrice" placeholder="8000" min="0">
      </div>

      <div class="form-group">
        <label for="feeRate">手数料率（%）</label>
        <input type="number" id="feeRate" value="10" min="0" max="100" step="0.1">
      </div>

      <div class="form-group">
        <label for="shipping">送料（円）</label>
        <input type="number" id="shipping" value="450" min="0">
      </div>

      <button onclick="calculate()">利益を計算する</button>

      <div id="warning" class="warning">仕入れ価格と販売価格を入力してください。</div>

      <div id="result" class="result">
        <div class="result-row">
          <span>商品名</span>
          <strong id="resultName">---</strong>
        </div>
        <div class="result-row">
          <span>販売手数料</span>
          <strong id="resultFee">0円</strong>
        </div>
        <div class="result-row">
          <span>送料</span>
          <strong id="resultShipping">0円</strong>
        </div>
        <div class="profit" id="profit">0円</div>
        <div class="rate" id="profitRate">利益率 0%</div>
        <div id="judgment" class="judgment">---</div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const productName = document.getElementById("productName").value.trim() || "商品名未入力";
      const purchasePrice = Number(document.getElementById("purchasePrice").value);
      const sellingPrice = Number(document.getElementById("sellingPrice").value);
      const feeRate = Number(document.getElementById("feeRate").value);
      const shipping = Number(document.getElementById("shipping").value);

      const warning = document.getElementById("warning");
      const result = document.getElementById("result");

      if (!Number.isFinite(purchasePrice) || !Number.isFinite(sellingPrice) ||
          purchasePrice <= 0 || sellingPrice < 0) {
        warning.style.display = "block";
        result.classList.remove("show");
        return;
      }

      warning.style.display = "none";

      const fee = sellingPrice * (feeRate / 100);
      const profit = sellingPrice - fee - shipping - purchasePrice;
      const profitRate = (profit / purchasePrice) * 100;

      document.getElementById("resultName").textContent = productName;
      document.getElementById("resultFee").textContent = Math.round(fee).toLocaleString() + "円";
      document.getElementById("resultShipping").textContent = Math.round(shipping).toLocaleString() + "円";
      document.getElementById("profit").textContent = "利益 " + Math.round(profit).toLocaleString() + "円";
      document.getElementById("profitRate").textContent = "利益率 " + profitRate.toFixed(1) + "%";

      const judgment = document.getElementById("judgment");
      if (profit > 0) {
        judgment.textContent = "✅ 仕入れ候補";
        judgment.className = "judgment buy";
      } else {
        judgment.textContent = "❌ 見送り";
        judgment.className = "judgment skip";
      }

      result.classList.add("show");
    }
  </script>
</body>
</html>
